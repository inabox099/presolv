[package]
name = "presolv"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inabox099/presolv"
description = "High-performance bulk/streaming DNS resolver core"

[lib]
name = "_presolv"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-util = "0.7"
rand = "0.9"
socket2 = "0.5"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
