[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "presolv"
version = "0.1.0"
description = "High-performance bulk/streaming DNS resolver (Rust core, dnspython API)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["dnspython>=2.4"]

[project.urls]
Repository = "https://github.com/inabox099/presolv"
Issues = "https://github.com/inabox099/presolv/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "presolv._presolv"
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
build = "cp39-*"            # abi3 wheel: one build per platform covers all Python >= 3.9
skip = "*-musllinux_i686 *-win32 *_i686"
test-requires = ["pytest"]
test-command = "pytest {project}/python/tests -q"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
