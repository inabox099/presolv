name: wheels
on:
  push: { tags: ["v*"] }
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2
      - uses: actions/upload-artifact@v4
        with: { name: wheels-${{ matrix.os }}, path: wheelhouse/*.whl }
